################################################################################

# Configuration file for the ZVBattleMessages plugin. The file must be in
# `Data/configs/plugins/`.


########################################
#  GLOSSARY OF COMMONLY LISTED FIELDS  #
########################################

# +---- ENABLE ----+
# Whether to enable a particular option.


# +---- OFFSETS ----+
# Logical pixel offsets relative to a popup message's anchor point.
#
# For popups tied to a battler or a side of the field, input
# `[[$X1, $Y1], [$X2, $Y2]]`, where:
#
#   - $X1 = x-offset for the player's battler/side
#   - $Y1 = y-offset for the player's battler/side
#   - $X2 = x-offset for the enemy's battler/side
#   - $Y2 = y-offset for the enemy's battler/side
#
# For popups tied to the entire field, input `[[$X, $Y]]`, where $X and $Y are
# the offsets for the field.


# +---- ANIMATION ----+
# A popup message's animation type.
#
# Choices:
#   - rise      => Steadily rise over time.
#   - fall      => Steadily fall over time.
#   - flicker   => Flicker on and off.
#   - bounce    => Bounce once.
#   - roll_fade => Roll to a direction only during fades


# +---- BACKGROUND ----+
# Name of the file in `graphics/animations/$FILE_PREFIX/backgrounds/` for a
# popup message's background.
#
# See the `file_prefix` setting for what $FILE_PREFIX is.


#######################
# SETTINGS START HERE #
#######################

# CSV file ID for this plugin.
#
# The corresponding .csv file must be in `Data/Text/Dialogs/`.
csv_id: 93208


# Path identifier for graphics and SFX files required by this plugin, giving you
# a way for the plugin to use your custom assets instead of its own. This keeps
# your custom files separate and safe from being deleted by mistake when
# uninstalling this plugin.
#
# Suppose `file_prefix` is set to `zv_battle_msg` (the default value). In that
# case:
#
#   - This plugin loads graphic files from `graphics/animations/$FILE_PREFIX/`.
#     Example: `graphics/animations/zv_battle_msg/`
#
#   - This plugin loads SE files that start with $FILE_PREFIX from `audio/se/`.
#     Example: `audio/se/zv_battle_msg-perish_countdown.ogg`
file_prefix: zv_battle_msg


# Global font ID for most popup messages' text. In a vanilla PSDK project, this
# ID represents PowerGreen Small of font size 8. Graphics provided by this
# plugin are designed with this font in mind.
font_id: 20


# Global font color ID for most popup messages' text. In a vanilla PSDK project,
# this ID represents white.
text_color: 9


# Global offsets for most popup messages
offsets: [[0, -42], [0, -42]]


# Popup messages for the effectiveness of a hit (replacing dialogue messages).
# They don't include immunities, which are handled by the `replace_unaffected`
# option instead.
replace_effectiveness:
  enable: true

  super_effective:
    background: zigzag_red
    animation:  blaze

  not_very_effective:
    background: amorphous_blue
    animation:  blaze


# Popup message for an attack not affecting a target (replacing dialogue
# messages).
replace_unaffected:
  enable: true
  background: amorphous_white
  animation: roll_fade
  offsets: [[0, -35], [0, -2]]


# Applies the following:
#   1. Popup message for a missed attack (replacing dialogue messages).
#   2. Custom animation for the attacked target dodging the attack.
replace_miss:
  enable: true
  offsets: [[0, -35], [0, -2]]


# Popup message for a critical hit (replacing dialogue messages).
replace_crit:
  enable: true
  background: zigzag_white
  animation: blaze
  offsets: [[0, -42], [0, -42]]


# Floating damage numbers for health lost and restored.
show_damage_numbers:
  enable: true
  offsets: [[0, -35], [0, -2]]

  # Font color ID for health lost.
  hurt_color: 9

  # Font color ID for health restored.
  heal_color: 13

  # How damage numbers are represented.
  #
  # Choices:
  #   - percent => Percentage rounded to the nearest whole number, e.g., 25%.
  #   - points  => Exact HP quantity, e.g. 50HP.
  measurement: percent

  # Display the unit in the text.
  show_unit: false


# Popup messages for stat stage changes (replacing dialogue messages).
replace_stat_change:
  enable: true

  stat_up:
    background: dark
    animation: rise

  stat_down:
    background: dark
    animation: fall


# Popup messages for a battler being affected by a non-volatile status condition
# (replacing dialogue messages). These non-volatile status conditions are
# poison, toxic, burn, paralysis, and freeze.
#
# For smoother player experience, it is recommended you replace the "PSN" status
# icon for badly poisoned with "TOX" or similar.
replace_status:
  enable: true
  animation: rise

  # This background is for popup messages abouT coping with a status condition,
  # not for when a status condition is inflicted.
  background: dark


# Popup messages (replacing dialogue messages) for:
#   - a battler using an attack
#   - an attack failing
#   - a trainer using a bag item
#
# Options affected by this one:
#   - replace_confusion
#   - replace_taunt
replace_move_usage:
  enable: true
  offsets: [[0, 0]]


# Popup messages for a battler being affected by confusion (replacing dialogue
# messages).
#
# Disabling the `replace_move_usage` option will disable part of this option.
replace_confusion:
  enable: true
  background: dark
  animation: rise


# Applies the following (replacing dialogue messages):
#   1. Popup message for being inflicted with the Perish Song condition.
#   2. Custom animation for a battler's perish count going down.
replace_perish:
  enable: true

  # These fields are for the popup message about the infliction.
  background: dark
  animation: rise


# Popup messages for being affected by Taunt (replacing dialogue messages).
#
# Disabling the `replace_move_usage` option will disable part of this option.
replace_taunt:
  enable: true
  background: dark
  animation: rise


# Prevent specific battle dialogue messages from being shown.
silence_messages:
  enable: true

  # Message list:
  messages:
    - csv_id: 19   # ID of the CSV file containing the message.
      text_id: 905 # Text ID in the CSV file where the message is located.
      memo: generic energy drain # Optional memo not shown in-game.

######################
# SETTINGS END HERE  #
######################
